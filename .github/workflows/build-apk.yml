name: Build APK (32-bit & 64-bit)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 还原签名 keystore
        working-directory: ./gpslink
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$SIGNING_KEY_BASE64" | base64 -d > keystore/gpslink.jks
          ls -lh keystore/gpslink.jks

      - name: 赋予 Gradle 执行权限
        working-directory: ./gpslink
        run: chmod +x ./gradlew

      - name: 编译 Release APK（含 32/64/通用）
        working-directory: ./gpslink
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 校验 APK 已签名
        working-directory: ./gpslink/app/build/outputs/apk/release
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | head -1)
          fail=0
          for f in *.apk; do
            if "$APKSIGNER" verify "$f" > /dev/null 2>&1; then
              echo "已签名: $f"
            else
              echo "未签名: $f"; fail=1
            fi
          done
          exit $fail

      - name: 重命名产物
        working-directory: ./gpslink/app/build/outputs/apk/release
        run: |
          for f in *arm64-v8a*.apk;  do [ -e "$f" ] && mv "$f" gnss-link-64bit-arm64-v8a.apk; done
          for f in *armeabi-v7a*.apk; do [ -e "$f" ] && mv "$f" gnss-link-32bit-armeabi-v7a.apk; done
          for f in *universal*.apk;   do [ -e "$f" ] && mv "$f" gnss-link-universal.apk; done
          ls -lh *.apk

      - name: 上传 64 位 APK
        uses: actions/upload-artifact@v4
        with:
          name: gnss-link-64bit-arm64-v8a
          path: gpslink/app/build/outputs/apk/release/gnss-link-64bit-arm64-v8a.apk
          if-no-files-found: error

      - name: 上传 32 位 APK
        uses: actions/upload-artifact@v4
        with:
          name: gnss-link-32bit-armeabi-v7a
          path: gpslink/app/build/outputs/apk/release/gnss-link-32bit-armeabi-v7a.apk
          if-no-files-found: error

      - name: 上传通用 APK
        uses: actions/upload-artifact@v4
        with:
          name: gnss-link-universal
          path: gpslink/app/build/outputs/apk/release/gnss-link-universal.apk
          if-no-files-found: error

      # 推送到 main/master 或打 tag 时，自动把 APK 发成 Release，用户可直接下载安装。
      # PR 不发布，避免 fork 的 PR 拿到写权限。
      - name: 发布 Release
        if: github.event_name == 'push'
        working-directory: ./gpslink
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          TAG="v${VERSION}"
          APKDIR="app/build/outputs/apk/release"
          echo "版本: $VERSION -> tag: $TAG"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件"
            gh release upload "$TAG" "$APKDIR"/*.apk --clobber --repo "${{ github.repository }}"
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$APKDIR"/*.apk \
              --repo "${{ github.repository }}" \
              --title "GNSS Link $TAG" \
              --notes "自动构建发布。下载 gnss-link-universal.apk 安装即可，兼容所有安卓设备。" \
              --latest
          fi

  # 在真实 Android 模拟器里安装并截图，用来验证多分辨率与横竖屏排版。
  screenshot:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载通用 APK
        uses: actions/download-artifact@v4
        with:
          name: gnss-link-universal
          path: apk

      - name: 开启 KVM 加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 模拟器内运行并截图
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: apk/gnss-link-universal.apk
          OUT_DIR: screenshots
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
          if-no-files-found: error


name: Legacy Android Smoke Test

# 在真实的低版本 Android 模拟器上验证：能装、能启动、界面不是白屏、没有崩溃。
# 只手动触发，不跟着 push 跑。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: 还原签名 keystore
        working-directory: ./gpslink
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$SIGNING_KEY_BASE64" | base64 -d > keystore/gpslink.jks
      - run: chmod +x ./gradlew
        working-directory: ./gpslink
      - name: 编译通用 APK
        working-directory: ./gpslink
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: 取出 universal APK
        run: |
          mkdir -p apk
          cp gpslink/app/build/outputs/apk/release/*universal*.apk apk/gnss-link.apk
          ls -lh apk/
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-apk
          path: apk/gnss-link.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 19=Android 4.4（目标），21=5.0，23=6.0（GpsStatus 与运行时权限的分界）
        api: [19, 21, 23]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: legacy-apk
          path: apk

      - name: 开启 KVM 加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API ${{ matrix.api }} 上安装并启动
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # API 19 没有 google_apis 镜像，必须用 default
          target: default
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/legacy-smoke.sh ${{ matrix.api }}

      - name: 上传截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-shots-api${{ matrix.api }}
          path: legacy-out
          if-no-files-found: warn
